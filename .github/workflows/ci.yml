name: Continuous Integration

on:
  push:
    branches: [ main, develop, funcshape ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.14']
        # Temporarily exclude Windows due to Unicode issues
        # Will re-enable after fixing encoding problems

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs history and tags to compute the version

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest pytest-cov

    - name: Show installed version
      run: python -c "import apdist; print('apdist', apdist.__version__)"

    - name: Run basic functionality test
      run: |
        cd testing
        python test_basic_functionality.py

    - name: Run full test suite with coverage
      run: |
        cd testing
        python -m pytest tests/ -v --tb=short --cov=apdist --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@v4
      with:
        files: ./testing/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
